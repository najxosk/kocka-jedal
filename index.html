<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#2b1a12">
<title>Kocka jedál 🎲</title>
<style>
  :root{
    --bg1:#2b1a12; --bg2:#4a2413; --accent:#ffb45e; --accent2:#ff7e5f;
    --card:#fff7ec; --card-txt:#3a2418; --dim:#d9b48a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:radial-gradient(circle at 50% 20%, var(--bg2), var(--bg1) 70%);
    color:#fff; overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:16px; touch-action:none;
  }
  h1{
    font-size:26px; margin:0 0 6px; font-weight:800; letter-spacing:.5px;
    display:flex; align-items:center; gap:8px;
  }
  .sub{color:var(--dim); font-size:15px; margin-bottom:14px; text-align:center;}
  .sub b{color:var(--accent);}

  /* Toggle */
  .toggle{
    display:flex; background:rgba(255,255,255,.08); border-radius:999px; padding:4px;
    gap:4px; margin-bottom:22px; border:1px solid rgba(255,255,255,.15);
  }
  .toggle button{
    border:0; background:transparent; color:var(--dim); font-weight:700;
    padding:8px 16px; border-radius:999px; font-size:14px; cursor:pointer;
  }
  .toggle button.on{background:linear-gradient(135deg,var(--accent2),var(--accent)); color:#3a2418;}

  /* Dice stage */
  .stage{width:140px; height:140px; perspective:600px; margin-bottom:24px;}
  .dice{
    width:140px; height:140px; position:relative; transform-style:preserve-3d;
    cursor:pointer;
  }
  .face{
    position:absolute; width:140px; height:140px; border-radius:18px;
    background:linear-gradient(145deg,#fff, #ffe4b8);
    display:flex; align-items:center; justify-content:center;
    font-size:66px; box-shadow:inset -6px -8px 18px rgba(0,0,0,.18);
  }
  .f1{transform:rotateY(0deg)    translateZ(70px);}
  .f2{transform:rotateY(90deg)   translateZ(70px);}
  .f3{transform:rotateY(180deg)  translateZ(70px);}
  .f4{transform:rotateY(-90deg)  translateZ(70px);}
  .f5{transform:rotateX(90deg)   translateZ(70px);}
  .f6{transform:rotateX(-90deg)  translateZ(70px);}
  .dice.spin{animation:roll 1s cubic-bezier(.2,.7,.3,1.1);}
  @keyframes roll{
    0%   {transform:rotateX(0) rotateY(0) rotateZ(0);}
    25%  {transform:rotateX(220deg) rotateY(140deg) rotateZ(80deg);}
    50%  {transform:rotateX(420deg) rotateY(300deg) rotateZ(-60deg);}
    75%  {transform:rotateX(560deg) rotateY(460deg) rotateZ(40deg);}
    100% {transform:rotateX(700deg) rotateY(620deg) rotateZ(0);}
  }

  /* Result card */
  .card{
    width:100%; max-width:340px; min-height:130px;
    background:var(--card); color:var(--card-txt); border-radius:22px;
    padding:20px 22px; text-align:center;
    box-shadow:0 18px 40px rgba(0,0,0,.45);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
  }
  .card .hangry{font-size:34px; margin-bottom:6px; line-height:1;}
  .card .idea{font-size:24px; font-weight:800; margin:0; line-height:1.25;}
  .card .kind-tag{
    position:absolute; top:12px; right:12px; font-size:12px; font-weight:700;
    background:var(--accent); color:#3a2418; padding:3px 10px; border-radius:999px;
  }
  .card.hidden{display:none;}
  .hint{color:var(--dim); font-size:14px; margin-top:14px; text-align:center;}
</style>
</head>
<body>

  <h1>Kocka jedál 🎲</h1>
  <div class="sub">Nevieš čo jesť? <b>Hod kockou!</b></div>

  <div class="toggle" id="toggle">
    <button data-mode="klasika" class="on">🍖 Klasická</button>
    <button data-mode="veg">🥦 Vegetariánska</button>
  </div>

  <div class="stage">
    <div class="dice" id="dice">
      <div class="face f1">🍕</div>
      <div class="face f2">🍜</div>
      <div class="face f3">🍝</div>
      <div class="face f4">🌮</div>
      <div class="face f5">🥘</div>
      <div class="face f6">🍣</div>
    </div>
  </div>

  <div class="card hidden" id="card">
    <div class="hangry" id="hangry"></div>
    <p class="idea" id="idea"></p>
    <div class="kind-tag" id="kindTag"></div>
  </div>
  <div class="hint" id="hint">Dotkni sa kocky 🎲</div>

<script>
(function(){
  var MODE = localStorage.getItem('kocka_mode') || 'klasika';

  function LOG(){
    try{ return JSON.parse(localStorage.getItem('kocka_log') || '[]'); }
    catch(e){ return []; }
  }
  function LOGSAVE(a){
    try{ localStorage.setItem('kocka_log', JSON.stringify(a)); }catch(e){}
  }

  var KLASIKA = [
    ['🍕','Pizza','Žiadne premýšľanie, len tam choď.'],
    ['🍜','Ramen','Horúca misa, akoby si bol v Tokiu.'],
    ['🍝','Cestoviny Carbonara','Krémové, slané, dokonalé.'],
    ['🌮','Tacos','S trochou chilli presne ako má byť.'],
    ['🥘','Gulášová polievka','Sedliacka klasika do sýtosti.'],
    ['🍔','Burger s hranolkami','Fast food deň, nikomu to nehovor.'],
    ['🍣','Sushi set','Ľahké a trochu luxusné.'],
    ['🍗','Pečené kura s ryžou','Bezpečná voľba, čo nikdy nesklame.'],
    ['🫕','Fondue na spôsob prím','Roztopený syr = šťastná nálada.'],
    ['🌭','Hotdog s knedľou','Kedysi z bufetu, dnes chýba.'],
    ['🥓','Slanina s vajcami','Raňajky, ktoré môžeš jesť aj večer.'],
    ['🍖','Bravčové rezne s kašou','Nedeľná paráda.'],
    ['🍲','Kapustnica','Fermentovaná chuť Slovenska.'],
    ['🥟','Plnené pirohy','S bryndzou alebo s tvarohom.'],
    ['🍗','Kura popcorn s dipom','Malé kúsky, veľká radosť.'],
    ['🍜','Fazuľový guláš','Sýty a lacný, ako od babky.'],
    ['🌶️','Chilli con carne','Ostré pre odvážnych.'],
    ['🍚','Vyprážaná ryža s kuracím','Rýchle, chutné, z panvice.'],
    ['🥣','Krutonová polievka','Paradajková s čerstvým chlebom.'],
    ['🧀','Grilovaný syr so šalátom','Relax na tanieri.'],
    ['🥔','Francúzske zemiaky','Maslo a kôpor, jednoduché srdce.'],
    ['🫓','Kebab s chlebom','Neskorá večera, keď vtedy jedeš.'],
    ['🍤','Plnené krevety','Nech sa ti v lete páči.'],
    ['🥖','Bageta s pečeným mäsom','Na výlet, nie na tanier.'],
    ['🍳','Omeleta so žampiónmi','Mäkká, nadýchaná, s láskou.'],
  ];

  var VEG = [
    ['🥦','Brokolica s cestovinami','Zelená a dobre.'],
    ['🥗','Šalát s avokádom','Ľahký obed, žiadna ťarcha.'],
    ['🍕','Veggi pizza','Čistá zeleninová klasika.'],
    ['🥔','Šťavnaté zemiaky s tvargom','Sýto a jemne.'],
    ['🥟','Bryndzové pirohy','Slovenská vegetariánska hviezda.'],
    ['🍲','Zeleninová polievka','Hreje tak, že sa ti to páči.'],
    ['🥑','Toast s avokádom','Brunch, ktorý vyzerá na Instagram.'],
    ['🫛','Cícer na kari s ryžou','Orientálna chuť plná bielkovín.'],
    ['🧀','Grilovaný syr so zeleninou','Zmäkčený a slaný, perfektný.'],
    ['🥔','Halušky s hubovou omáčkou','Lesná láska na tanieri.'],
    ['🥕','Zeleninové kari s kokosom','Sladké a sýte.'],
    ['🍝','Penne s bazalkovým pestom','Vône, na ktoré nezabudneš.'],
    ['🥞','Slané lievance so syrom','Zmena oproti sladkým.'],
    ['🥬','Špenát so smotanou a zemiakov','Zdravé srdce na tanieri.'],
    ['🫑','Plnená paprika so šošovicou','Plnenie bez mäsa, chuť nezmenená.'],
    ['🥙','Falafel v pitke','Chrumkavé a voňavé.'],
    ['🍆','Parmigiana (baklažán)','Talianska vrstvená dobrota.'],
    ['🌽','Mexická kukuricová polievka','Krémová a sladká.'],
    ['🥦','Karfiol s omáčkou','Upravený na mäso podľa nálady.'],
    ['🍛','Šošovicový prívarok s haluškami','Klasika, čo si zamiluješ.'],
    ['🥟','Knedličky so zemiakovou omáčkou','Romantika večera.'],
    ['🥔','Zemiakové placky','Chrumkavé, zlaté, šťavnaté.'],
    ['🥗','Caprese salad','Paradajky, mozzarella, bazalka.'],
    ['🍄','Hubová omáčka s knedľou','Vôňa lesa, oddych.'],
  ];

  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  var dice = document.getElementById('dice');
  var card = document.getElementById('card');
  var hangry = document.getElementById('hangry');
  var idea = document.getElementById('idea');
  var kindTag = document.getElementById('kindTag');
  var hint = document.getElementById('hint');
  var log = LOG();

  function currentArr(){ return MODE==='veg'?VEG:KLASIKA; }
  // vyberanie tak, aby som nehádzal to isté dvakrát za sebou
  function pickAvoidLast(arr){
    var last = log.length ? log[log.length-1] : null;
    var candidates = arr.filter(function(x){ return x[1] !== last; });
    if(!candidates.length) candidates = arr;
    return pick(candidates);
  }

  function applyToggle(){
    var btns = document.querySelectorAll('#toggle button');
    btns.forEach(function(b){
      b.classList.toggle('on', b.dataset.mode === MODE);
    });
  }

  function roll(){
    var arr = currentArr();
    var item = pickAvoidLast(arr);
    log.push(item[1]);
    if(log.length>10) log=log.slice(-10);
    LOGSAVE(log);

    var faces = dice.querySelectorAll('.face');
    // random faces
    var shown = [];
    for(var i=0;i<6;i++) shown.push(pick(arr));
    faces.forEach(function(f,idx){ f.textContent = shown[idx][0]; });

    dice.classList.remove('spin');
    void dice.offsetWidth; // restart animacia
    dice.classList.add('spin');

    detail(item, arr===VEG);
    setTimeout(function(){ dice.classList.remove('spin'); }, 1100);
  }

  function detail(item, isVeg){
    var idx = log.indexOf(item[1]) + 1;
    hangry.textContent = item[0];
    idea.textContent = item[1];
    kindTag.textContent = isVeg ? '🥦 Veg' : '🍖 Klasika';
    card.classList.remove('hidden');
    d('kocka_log', 'posledny:'+item[1]);
    hint.textContent = 'Číslo v rade: #' + idx + ' — hod znova!';
  }

  var t = document.getElementById('toggle');
  t.addEventListener('pointerup', function(e){
    var b = e.target.closest('button');
    if(!b) return;
    MODE = b.dataset.mode;
    applyToggle();
    LOGSAVE(log);
    document.getElementById('card').classList.add('hidden');
    hint.textContent = 'Dotkni sa kocky 🎲';
    // reset faces inline
    var faces=dice.querySelectorAll('.face');
    var arr=currentArr();
    faces.forEach(function(f,i){ f.textContent = i<arr.length?arr[i][0]:'❓'; });
  });
  t.addEventListener('pointerdown', function(e){ e.preventDefault(); });
  t.addEventListener('touchstart', function(e){ e.preventDefault(); }, {passive:false});

  // Cesta: pointerup na container (dotyk aj mys)
  document.getElementById('dice').parentElement.addEventListener('pointerup', function(e){
    if(e.target.closest('#dice')) roll();
  });
  document.getElementById('dice').addEventListener('pointerdown', function(e){ e.preventDefault(); });
  document.getElementById('dice').addEventListener('touchstart', function(e){ e.preventDefault(); }, {passive:false});

  function d(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

  // debug API pre testy
  window.GAME = {
    get: function(){ return { mode: MODE, count: (MODE==='veg'?VEG:KLASIKA).length,
      last: log.length?log[log.length-1]:null, vis: card.classList.contains('hidden')?'hidden':'shown' }; },
    set: function(m){ MODE = (m==='veg')?'veg':'klasika'; applyToggle(); },
    roll: function(){ roll(); },
    count: function(){ return (MODE==='veg'?VEG:KLASIKA).length; }
  };

  applyToggle();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b1a12">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kocka jedál">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Kocka jedál 🎲</title>
<style>
  :root{
    --bg1:#2b1a12; --bg2:#4a2413; --accent:#ffb45e; --accent2:#ff7e5f;
    --card:#fff7ec; --card-txt:#3a2418; --dim:#d9b48a;
    --S:clamp(108px, 28vw, 150px);
    --m:clamp(46px, 13.5vw, 72px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:
      radial-gradient(ellipse 70% 42% at 50% 18%, rgba(255,186,110,.16), transparent 70%),
      radial-gradient(circle at 50% 100%, #1a0e09, var(--bg1) 55%);
    color:#fff; overflow:hidden; user-select:none; -webkit-user-select:none;
    display:flex; flex-direction:column; align-items:center;
    height:100dvh; max-height:100dvh;
    padding:max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    touch-action:none;
  }
  .top{flex:none; text-align:center; width:min(920px, 100%);}
  h1{font-size:clamp(20px, 4.6vw, 30px); margin:0; font-weight:800; letter-spacing:.3px;
    display:flex; align-items:center; justify-content:center; gap:8px;}
  .sub{color:var(--dim); font-size:clamp(12px, 3.1vw, 15px); margin:2px 0 6px; text-align:center;}
  .sub b{color:var(--accent);}

  .shelf-scene{flex:none; width:min(920px, 100%); position:relative; margin-bottom:2px;}
  .shelf-row{display:flex; justify-content:center; align-items:flex-start;
    gap:clamp(4px, 1.4vw, 16px); position:relative; z-index:2; padding:2px 4px 0;}
  .mini{
    width:clamp(58px, 18vw, 96px); border:0; background:transparent; color:inherit;
    padding:0; cursor:pointer; font:inherit; position:relative;
  }
  .mini:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:12px;}
  .cubelet{
    width:var(--m); height:var(--m); margin:0 auto;
    position:relative; transform-style:preserve-3d;
    transform:rotateX(-20deg) rotateY(-34deg);
  }
  .cubelet i{
    position:absolute; inset:0; border-radius:8px; font-style:normal;
    background:linear-gradient(160deg, #fffaf3, #f0c98a);
    border:1px solid rgba(120,72,24,.38);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.7);
  }
  .cubelet .cfront{
    transform:translateZ(calc(var(--m) / 2));
    display:flex; align-items:center; justify-content:center;
    font-size:calc(var(--m) * .46);
  }
  .cubelet .ct{transform:rotateX(90deg) translateZ(calc(var(--m) / 2)); background:linear-gradient(#ffe6c2, #e2b06a);}
  .cubelet .cl{transform:rotateY(-90deg) translateZ(calc(var(--m) / 2)); background:#ddb07a;}
  .cubelet .cr{transform:rotateY(90deg) translateZ(calc(var(--m) / 2)); background:#f6d7a6;}
  .mini.veg .cubelet i{background:linear-gradient(160deg, #f5fff4, #b9e2aa); border-color:rgba(50,90,40,.28);}
  .mini.veg .cubelet .ct{background:linear-gradient(#e7f8df, #8fc47e);}
  .mini.veg .cubelet .cl{background:#9dcb8c;}
  .mini.veg .cubelet .cr{background:#d3ecc6;}
  .mini.locked{cursor:not-allowed;}
  .mini.locked .cubelet i{background:linear-gradient(160deg, #eceae8, #b7b3ae); border-color:rgba(40,40,40,.25);}
  .mini.locked .cubelet .ct{background:linear-gradient(#e4e2df, #a8a4a0);}
  .mini.locked .cubelet .cl{background:#b0aca8;}
  .mini.locked .cubelet .cr{background:#d4d0cc;}
  .mini.locked .cfront{filter:grayscale(.35);}
  .lock{
    position:absolute; right:3px; bottom:2px; font-size:11px; line-height:1;
    filter:none;
  }
  .mlabel{
    display:block; margin-top:16px; text-align:center; font-size:clamp(10px, 2.6vw, 13px);
    font-weight:800; color:var(--dim); line-height:1.15; min-height:2.2em; position:relative; z-index:5;
  }
  .mini.on .mlabel{color:var(--accent);}
  .mini.on .cubelet .cfront{box-shadow:0 0 0 2px var(--accent), inset 0 1px 0 rgba(255,255,255,.7);}
  .mini.away{opacity:0; pointer-events:none; transform:translateY(8px) scale(.8);}
  .mini.pop{animation:miniPop .48s cubic-bezier(.2,1.45,.32,1);}
  @keyframes miniPop{
    from{opacity:0; transform:translateY(-14px) scale(.45);}
    to{opacity:1; transform:none;}
  }
  .mini.shake{animation:shake .42s ease;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-4px);}
    50%{transform:translateX(4px);}
    75%{transform:translateX(-2px);}
  }
  .board{
    position:absolute; left:2%; right:2%; top:calc(var(--m) - 2px); height:15px; z-index:4;
    border-radius:4px 4px 12px 12px; pointer-events:none;
    background:linear-gradient(#e7b57a, #b4783e 48%, #7a4c22);
    box-shadow:0 7px 0 #5a3516, 0 12px 16px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,236,210,.45);
  }

  .arena{
    flex:1; width:min(980px, 100%); min-height:0; position:relative;
    perspective:980px; perspective-origin:50% 36%;
    background:linear-gradient(180deg, transparent 42%, rgba(0,0,0,.2) 100%);
    border-radius:18px;
  }
  .floor{
    position:absolute; left:4%; right:4%; bottom:8px; height:22px; z-index:0;
    border-radius:50%;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 2px, transparent 2px 16px),
      linear-gradient(#9a6840, #4a2d18);
    box-shadow:0 8px 0 rgba(0,0,0,.28), inset 0 2px 0 rgba(255,220,180,.28);
  }
  .shadow{
    position:absolute; left:0; top:0; width:calc(var(--S) * .82); height:22px; z-index:1;
    border-radius:50%; pointer-events:none; opacity:0;
    background:radial-gradient(ellipse at center, rgba(0,0,0,.55), rgba(0,0,0,0) 70%);
  }
  .burst{
    position:absolute; left:0; top:0; width:160px; height:160px; z-index:2;
    border-radius:50%; pointer-events:none; opacity:0;
    background:radial-gradient(circle, rgba(255,236,214,.7) 0%, rgba(255,196,120,.18) 42%, rgba(255,170,80,0) 70%);
  }
  .dice{
    width:var(--S); height:var(--S); position:absolute; left:0; top:0; z-index:3;
    transform-style:preserve-3d; transform-origin:center center;
    visibility:hidden; will-change:transform;
  }
  .dice.live{visibility:visible;}
  .face{
    --shade:.16;
    position:absolute; width:var(--S); height:var(--S); border-radius:calc(var(--S) * .12);
    background:
      linear-gradient(155deg, rgba(255,255,255,.72), rgba(255,255,255,0) 40%),
      linear-gradient(180deg, #fff9f1 0%, #f2d4a4 100%);
    display:flex; align-items:center; justify-content:center;
    font-size:calc(var(--S) * .36);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.88), inset 0 -12px 20px rgba(110,64,12,.16);
    border:1px solid rgba(150,98,36,.3);
    -webkit-backface-visibility:hidden; backface-visibility:hidden;
    pointer-events:none;
  }
  .dice[data-kind="veg"] .face{
    background:
      linear-gradient(155deg, rgba(255,255,255,.72), rgba(255,255,255,0) 40%),
      linear-gradient(180deg, #f4fff1 0%, #c6e4b0 100%);
    border-color:rgba(70,110,50,.28);
  }
  .face .shade{
    position:absolute; inset:0; border-radius:inherit;
    background:#3a2010; opacity:var(--shade); pointer-events:none;
  }
  .face .glow{
    position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:radial-gradient(circle at 30% 22%, rgba(255,255,255,.95), rgba(255,255,255,0) 46%);
    opacity:.45;
  }
  .face .em{position:relative; z-index:1;}
  .f1{transform:rotateY(0deg) translateZ(calc(var(--S) / 2));}
  .f2{transform:rotateY(90deg) translateZ(calc(var(--S) / 2));}
  .f3{transform:rotateY(180deg) translateZ(calc(var(--S) / 2));}
  .f4{transform:rotateY(-90deg) translateZ(calc(var(--S) / 2));}
  .f5{transform:rotateX(90deg) translateZ(calc(var(--S) / 2));}
  .f6{transform:rotateX(-90deg) translateZ(calc(var(--S) / 2));}
  .face.no{opacity:0; visibility:hidden;}
  .bowl{
    position:absolute; left:50%; top:64%; width:64%; height:38%;
    background:radial-gradient(ellipse at center, #6b3d18 0%, #2c160c 74%);
    border-radius:12px; opacity:0; pointer-events:none;
    transform:translate(-50%, -50%) translateZ(10px);
  }
  .spark{
    position:absolute; left:0; top:0; width:5px; height:5px; z-index:4;
    border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, #fff 0%, #ffe3b4 42%, rgba(255,196,110,0) 74%);
  }
  .food{
    position:absolute; left:0; top:0; z-index:6;
    font-size:clamp(46px, 12vw, 68px); line-height:1; padding:12px;
    opacity:0; pointer-events:none;
    filter:drop-shadow(0 8px 6px rgba(0,0,0,.35));
  }
  .food.ready{pointer-events:auto; cursor:pointer;}

  .robot{
    position:absolute; left:0; top:0; width:86px; height:108px; z-index:5;
    pointer-events:none; visibility:hidden;
  }
  .robot.on{visibility:visible;}
  .bot{position:absolute; inset:0;}
  .robot.flip .bot{transform:scaleX(-1);}
  .antenna{position:absolute; left:40px; top:0; width:4px; height:14px; background:#ffd7a1; border-radius:4px;}
  .antenna span{
    position:absolute; left:-4px; top:-7px; width:12px; height:12px; border-radius:50%;
    background:#ff7e5f; box-shadow:0 0 8px #ffb45e;
  }
  .head{
    position:absolute; left:20px; top:14px; width:44px; height:32px; z-index:2;
    background:linear-gradient(#fff, #f3d2a4); border-radius:14px;
    border:2px solid #8a5a32;
  }
  .eyes{display:flex; justify-content:center; gap:8px; margin-top:7px;}
  .eyes i{width:7px; height:9px; background:#3a2418; border-radius:4px; display:block; animation:blink 3.4s infinite;}
  .smile{width:14px; height:6px; margin:2px auto 0; border-bottom:2px solid #c45a3a; border-radius:0 0 10px 10px;}
  .torso{
    position:absolute; left:16px; top:42px; width:52px; height:36px; z-index:1;
    background:linear-gradient(#ffb45e, #e07a45); border-radius:12px; border:2px solid #8a4a28;
  }
  .torso b{display:block; width:18px; height:8px; margin:10px auto 0; background:#3a2418; border-radius:3px; opacity:.28;}
  .arm{position:absolute; left:54px; top:50px; width:40px; height:16px; transform-origin:4px 8px; z-index:3;}
  .stick{
    position:absolute; left:0; top:4px; width:24px; height:7px; border-radius:6px;
    background:#fff6ea; border:2px solid #8a5a32;
  }
  .spatula{position:absolute; left:16px; top:-16px; font-size:28px; line-height:1; transform:rotate(18deg);}
  .wheels{position:absolute; left:14px; top:78px; width:56px; height:18px;}
  .wheels i{
    position:absolute; top:0; width:16px; height:16px; border-radius:50%;
    background:radial-gradient(circle at 40% 40%, #9a9a9a, #222 68%);
    border:2px solid #111; transform:rotate(var(--spin, 0deg));
  }
  .wheels i:first-child{left:2px;}
  .wheels i:last-child{right:2px;}
  .wheels i::after{
    content:''; position:absolute; left:5px; top:5px; width:4px; height:4px; border-radius:50%; background:#eee;
  }
  .rshadow{
    position:absolute; left:12px; top:94px; width:60px; height:10px; border-radius:50%;
    background:rgba(0,0,0,.35);
  }
  @keyframes blink{
    0%, 42%, 48%, 100%{transform:scaleY(1);}
    45%{transform:scaleY(.12);}
  }

  .dock{
    flex:none; width:min(560px, 100%); height:128px; position:relative;
  }
  .card{
    position:absolute; left:50%; top:0; width:min(440px, calc(100% - 12px));
    transform:translateX(-50%);
    background:var(--card); color:var(--card-txt); border-radius:18px;
    padding:12px 18px 14px; text-align:center;
    box-shadow:0 14px 32px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.7);
    overflow:hidden; animation:cardIn .4s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes cardIn{
    from{opacity:0; transform:translateX(-50%) translateY(10px) scale(.98);}
    to{opacity:1; transform:translateX(-50%);}
  }
  .card .idea{font-size:clamp(16px, 4.2vw, 22px); font-weight:800; margin:0; line-height:1.25;}
  .card .note{display:none;}
  .card .kind-tag{position:absolute; top:8px; right:10px; font-size:11px; font-weight:800;
    background:var(--accent); color:#3a2418; padding:3px 8px; border-radius:999px;}
  .card.hidden{display:none;}
  .hint{
    position:absolute; left:8px; right:8px; bottom:4px; margin:0;
    color:var(--dim); font-size:clamp(13px, 3.4vw, 15px); min-height:20px; text-align:center;
  }
  .soon{
    position:fixed; z-index:40; transform:translate(-50%, -120%);
    background:#fff7ec; color:#3a2418; font-weight:800; font-size:13px;
    padding:6px 10px; border-radius:999px; box-shadow:0 8px 18px rgba(0,0,0,.28);
    pointer-events:none;
  }
  .installbtn{position:fixed; right:14px; bottom:calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(135deg,var(--accent2),var(--accent)); color:#3a2418;
    border:0; border-radius:999px; font-weight:800; font-size:14px; cursor:pointer;
    padding:11px 18px; box-shadow:0 8px 22px rgba(0,0,0,.35); z-index:50;}
  @media (max-height:700px){
    :root{--S:clamp(96px, 24vw, 124px); --m:clamp(42px, 12vw, 58px);}
    .dock{height:108px;}
    h1{font-size:20px;}
  }
  @media (max-height:540px){
    .sub{display:none;}
    .dock{height:86px;}
    .mlabel{min-height:0; margin-top:12px; font-size:10px;}
    :root{--S:88px; --m:40px;}
  }
  @media (min-width:900px){
    :root{--S:150px; --m:74px;}
  }
  @media (prefers-reduced-motion: reduce){
    .card,.mini.pop,.eyes i{animation:none;}
  }
</style>
</head>
<body>

  <header class="top">
    <h1>Kocka jedál 🎲</h1>
    <p class="sub">Ťukni na kocku na polici. <b>Spadne, dokotúľa sa a otvorí sa.</b></p>
  </header>

  <div class="shelf-scene" id="shelf">
    <div class="shelf-row">
      <button type="button" class="mini" data-mode="klasika" aria-label="Klasická kuchyňa">
        <span class="cubelet" aria-hidden="true"><i class="ct"></i><i class="cl"></i><i class="cr"></i><i class="cfront">🍖</i></span>
        <span class="mlabel">Klasická</span>
      </button>
      <button type="button" class="mini veg" data-mode="veg" aria-label="Vegetariánska kuchyňa">
        <span class="cubelet" aria-hidden="true"><i class="ct"></i><i class="cl"></i><i class="cr"></i><i class="cfront">🥦</i></span>
        <span class="mlabel">Vegetariánska</span>
      </button>
      <button type="button" class="mini locked" data-lock="filmy" aria-disabled="true" aria-label="Filmy, čoskoro">
        <span class="cubelet" aria-hidden="true"><i class="ct"></i><i class="cl"></i><i class="cr"></i><i class="cfront">🎬<b class="lock">🔒</b></i></span>
        <span class="mlabel">Filmy</span>
      </button>
      <button type="button" class="mini locked" data-lock="serialy" aria-disabled="true" aria-label="Seriály, čoskoro">
        <span class="cubelet" aria-hidden="true"><i class="ct"></i><i class="cl"></i><i class="cr"></i><i class="cfront">📺<b class="lock">🔒</b></i></span>
        <span class="mlabel">Seriály</span>
      </button>
      <button type="button" class="mini locked" data-lock="par" aria-disabled="true" aria-label="Pár, čoskoro">
        <span class="cubelet" aria-hidden="true"><i class="ct"></i><i class="cl"></i><i class="cr"></i><i class="cfront">💑<b class="lock">🔒</b></i></span>
        <span class="mlabel">Pár</span>
      </button>
    </div>
    <div class="board" aria-hidden="true"></div>
  </div>

  <div class="arena" id="arena">
    <div class="floor" id="floor"></div>
    <div class="shadow" id="shadow"></div>
    <div class="burst" id="burst"></div>
    <div class="dice" id="dice">
      <div class="bowl" id="bowl"></div>
      <div class="face f1 no"><span class="shade"></span><span class="glow"></span><b class="em">🍕</b></div>
      <div class="face f2 no"><span class="shade"></span><span class="glow"></span><b class="em">🍜</b></div>
      <div class="face f3 no"><span class="shade"></span><span class="glow"></span><b class="em">🍝</b></div>
      <div class="face f4 no"><span class="shade"></span><span class="glow"></span><b class="em">🌮</b></div>
      <div class="face f5 no"><span class="shade"></span><span class="glow"></span><b class="em">🥘</b></div>
      <div class="face f6 no"><span class="shade"></span><span class="glow"></span><b class="em">🍣</b></div>
    </div>
    <div class="food" id="food" role="button" tabindex="-1" aria-label="Odpratať jedlo">🍕</div>
    <div class="robot" id="robot" aria-hidden="true">
      <div class="bot">
        <div class="antenna"><span></span></div>
        <div class="head">
          <div class="eyes"><i></i><i></i></div>
          <div class="smile"></div>
        </div>
        <div class="torso"><b></b></div>
        <div class="arm" id="arm">
          <i class="stick"></i>
          <span class="spatula" id="spatula">🥄</span>
        </div>
        <div class="wheels" id="wheels"><i></i><i></i></div>
        <i class="rshadow"></i>
      </div>
    </div>
  </div>

  <div class="dock">
    <div class="card hidden" id="card">
      <p class="idea" id="idea"></p>
      <div class="note" id="note"></div>
      <div class="kind-tag" id="kindTag"></div>
    </div>
    <div class="hint" id="hint">Ťukni na kocku na polici</div>
  </div>
  <div class="soon" id="soon" hidden>Čoskoro</div>
  <button class="installbtn" id="installBtn" hidden>📲 Nainštalovať appku</button>

<script>

  var VEG = [
    ['🥟','Halušky s hubami'],

      a[0]*b[2] - a[1]*b[3] + a[2]*b[0] + a[3]*b[1],
      a[0]*b[3] + a[1]*b[2] - a[2]*b[1] + a[3]*b[0]

  function qFromBasis(X,Y,Z){
    var m00=X[0], m01=Y[0], m02=Z[0];

  var RESTS = (function(){

      if (d > bestDot){ bestDot = d; best = RESTS[i]; }
    }
    var dot = q[0]*best[0] + q[1]*best[1] + q[2]*best[2] + q[3]*best[3];

  function errAxis(q, target){

  function slerp(a, b, t){
    var d = a[0]*b[0] + a[1]*b[1] + a[2]*b[2] + a[3]*b[3];

        a[0] + (bb[0]-a[0])*t,
        a[1] + (bb[1]-a[1])*t,
        a[2] + (bb[2]-a[2])*t,
        a[3] + (bb[3]-a[3])*t

    }
    var th = Math.acos(Math.min(1, d));
    var s = Math.sin(th);
    var w1 = Math.sin((1-t)*th) / s;
    var w2 = Math.sin(t*th) / s;
    return [a[0]*w1 + bb[0]*w2, a[1]*w1 + bb[1]*w2, a[2]*w1 + bb[2]*w2, a[3]*w1 + bb[3]*w2];

  function stepSparks(dt){
    if (anim && anim.flash > 0){
      anim.flash -= dt;

    } else if ((!anim || anim.phase === 'hold') && burstEl){
      burstEl.style.opacity = '0';

    for (var i=sparkNodes.length-1;i>=0;i--){
      var spk = sparkNodes[i];
      spk.life -= dt;
      spk.vy += 560*dt;
      spk.x += spk.vx*dt;
      spk.y += spk.vy*dt;
      spk.vx *= Math.exp(-1.8*dt);
      if (spk.life <= 0){
        if (spk.el.parentNode) spk.el.parentNode.removeChild(spk.el);
        sparkNodes.splice(i, 1);

      spk.el.style.transform = 'translate('+spk.x.toFixed(1)+'px,'+spk.y.toFixed(1)+'px)';
    }

  function bounceWalls(){
    var pad = HALF + 12;
    var minX = pad;
    var maxX = Math.max(minX + 8, arenaW - pad);
    if (anim.x < minX){
      anim.x = minX;
      anim.vx = Math.abs(anim.vx) * 0.55;
      anim.w[2] = -anim.vx / Math.max(24, HALF);
    } else if (anim.x > maxX){
      anim.x = maxX;
      anim.vx = -Math.abs(anim.vx) * 0.55;
      anim.w[2] = -anim.vx / Math.max(24, HALF);
    }
  }

  function stepBody(dt){
    if (!(anim.y === 0 && anim.vy === 0)){
      anim.vy += anim.g*dt;
      anim.y += anim.vy*dt;

        var impact = anim.vy;
        anim.y = 0;
        var rest = (typeof anim.bounce === 'number') ? anim.bounce : 0.55;
        anim.vy = -impact * rest;
        anim.squash = -Math.min(0.075, 0.034 + impact/3800);

          anim.w[0] += (Math.random()*2-1) * Math.min(3.4, impact/70);
          anim.w[2] += (Math.random()*2-1) * Math.min(3.4, impact/70);
        }
        if ((anim.phase === 'fall' || anim.phase === 'roll') && impact > 90){
          anim.w[0] += (Math.random()*2-1) * Math.min(3.2, impact/300);
          anim.w[1] += (Math.random()*2-1) * Math.min(2.4, impact/360);

  function stepFall(dt){

  function enterRoll(){

      enterSettle();
      return;

    var pad = HALF + 14;
    var minX = pad;
    var maxX = Math.max(minX + 30, arenaW - pad);
    var roomL = Math.max(0, anim.x - minX);
    var roomR = Math.max(0, maxX - anim.x);
    var dir = roomR >= roomL ? 1 : -1;
    if (Math.random() < 0.18){
      if (dir < 0 && roomR > 80) dir = 1;
      else if (dir > 0 && roomL > 80) dir = -1;
    }
    var room = dir > 0 ? roomR : roomL;
    var dist = Math.max(80, Math.min(room * 0.84, Math.max(120, arenaW * 0.48)));

    anim.w[2] = -anim.vx / Math.max(24, HALF);

    anim.w[1] = (Math.random()*2-1) * 3.6;
  }

          anim.nextHop = anim.rollT + 0.32 + Math.random()*0.28;

    lightFaces(anim.q);
    setShadow(anim.y, anim.kick || 0, 1);

  function enterSettle(){

  function stepSettle(dt){
    anim.settleT += dt;
    anim.vx *= Math.exp(-7*dt);
    anim.x += anim.vx * dt;
    bounceWalls();
    var err = errAxis(anim.q, anim.target);
    var kp = 64, kd = 16;
    anim.w[0] += (kp*err.ang*err.ax - kd*anim.w[0]) * dt;
    anim.w[1] += (kp*err.ang*err.ay - kd*anim.w[1]) * dt;
    anim.w[2] += (kp*err.ang*err.az - kd*anim.w[2]) * dt;
    anim.q = integrate(anim.q, anim.w, dt);
    stepBody(dt);
    applyDice();
    lightFaces(anim.q);
    setShadow(anim.y, anim.kick || 0, 1);
    var speed = Math.hypot(anim.w[0], anim.w[1], anim.w[2]);
    var calm = err.ang < 0.09 && speed < 0.85 && anim.y > -1.2 && anim.vy === 0;
    var wait = anim.reduce ? 0.1 : 0.28;
    var cap = anim.reduce ? 0.28 : 0.86;
    if ((calm && anim.settleT > wait) || anim.settleT > cap) enterBurst();
  }

    anim.cardShown = false;
    food.textContent = anim.item[0];
    food.setAttribute('aria-label', 'Odpratať: ' + anim.item[1]);
    if (state === 'motion') hint.textContent = 'Otvára sa…';
  }

  function revealFood(){
    if (anim.cardShown) return;
    anim.cardShown = true;
    markFoodShown();
    showCard(anim.item, anim.isVeg);
    if (state !== 'robot'){
      hint.textContent = 'Ťukni na jedlo — robot ho odvezie';
      busy = false;
      state = 'reveal';
      armFoodReady();
    }
  }

  function stepBurst(dt){
    anim.burstT += dt;
    var t = anim.burstT;
    var turn = anim.reduce ? 0.12 : 0.34;
    if (t < turn){
      anim.q = slerp(anim.qFrom, [1,0,0,0], smooth(t / turn));
      anim.y += (0 - anim.y) * Math.min(1, dt*12);
      setFacesClosed();
      applyDice();
      lightFaces(anim.q);
      setShadow(anim.y, 0, 1);
      return;
    }
    anim.q = [1,0,0,0];
    anim.y = 0;
    anim.vy = 0;
    applyDice();
    lightFaces(anim.q);
    var u = smooth(Math.min(1, (t - turn) / (anim.reduce ? 0.18 : 0.5)));
    setOpenPose(-118 * u, 78 * u, u);
    if (!anim.handed){
      var pop = smooth(Math.min(1, Math.max(0, (t - turn - 0.06) / 0.34)));
      var home = foodRestPos();
      var hop = Math.sin(pop * Math.PI) * 12 * (1 - pop);
      if (pop > 0.05) markFoodShown();
      placeFood(home.x, home.y - hop, 0.28 + 0.72*pop, (1-pop)*-8, pop);
      if (pop > 0.72) revealFood();
    }
    setShadow(0, 0, 1);
    if (t > turn + (anim.reduce ? 0.28 : 0.6)) finishBurst();
  }

  function finishBurst(){
    if (!anim || anim.phase === 'hold') return;
    anim.phase = 'hold';
    anim.q = [1,0,0,0];
    anim.y = 0;
    anim.vy = 0;
    applyDice();
    lightFaces(anim.q);
    setOpenPose(-118, 78, 1);
    setShadow(0, 0, 1);
    if (!anim.handed){
      var home = foodRestPos();
      markFoodShown();
      placeFood(home.x, home.y, 1, 0, 1);
      revealFood();
    }
  }

  function failOpen(){
    if (!anim || !anim.item){
      busy = false;
      state = 'idle';
      anim = null;
      return;
    }
    try{
      measure();
      anim.q = [1,0,0,0];
      anim.y = 0;
      anim.phase = 'hold';
      dice.classList.add('live');
      applyDice();
      setOpenPose(-118, 78, 1);
      food.textContent = anim.item[0];
      var home = foodRestPos();
      placeFood(home.x, home.y, 1, 0, 1);
      revealFood();
    }catch(e){
      busy = false;
      state = 'idle';
    }
  }

  function loop(now){
    if (!anim || anim.phase === 'hold') return;
    try{
      var dt = anim.last ? Math.min(0.034, (now - anim.last)/1000) : 0.016;
      anim.last = now;
      if (dt < 0.001) dt = 0.001;
      anim.t += dt;
      measure();
      if (anim.phase === 'fall') stepFall(dt);
      else if (anim.phase === 'roll') stepRoll(dt);
      else if (anim.phase === 'settle') stepSettle(dt);
      else if (anim.phase === 'burst') stepBurst(dt);
      stepSparks(dt);
      if (anim && anim.phase !== 'hold') anim.raf = requestAnimationFrame(loop);
    } catch (err){
      console.error(err);
      failOpen();
    }
  }

  function launch(token, item, isVeg, origin, scale0){
    var reduce = reducedMotion();
    anim = {
      token: token,
      phase: 'fall',
      t: 0,
      last: 0,
      q: qn([1, Math.random()*0.35-0.15, Math.random()*0.4-0.2, Math.random()*0.35-0.15]),
      w: [
        (Math.random()*2-1) * (reduce ? 0.6 : 5.2),
        (Math.random()*2-1) * (reduce ? 0.6 : 6.4),
        (Math.random()*2-1) * (reduce ? 0.4 : 4.4)
      ],
      x: origin.x,
      y: reduce ? Math.max(origin.y, -70) : origin.y,
      vx: (Math.random()*2-1) * (reduce ? 8 : 28),
      vy: reduce ? 60 : 30,
      g: reduce ? 2800 : 2200,
      bounce: reduce ? 0.05 : 0.32,
      squash: 0,
      kick: 0,
      impacts: 0,
      landed: false,
      item: item,
      isVeg: isVeg,
      reduce: reduce,
      scale0: reduce ? 1 : scale0,
      flash: 0,
      handed: false,
      raf: 0
    };
    measure();
    applyDice();
    lightFaces(anim.q);
    setShadow(anim.y, 0, 1);
    anim.raf = requestAnimationFrame(loop);
  }

  function hideFood(){
    food.classList.remove('shown', 'ready');
    food.style.opacity = '0';
    food.style.transform = 'translate3d(-400px,0,0)';
    food.setAttribute('tabindex', '-1');
  }

  function resetCube(){
    if (anim){
      cancelAnimationFrame(anim.raf);
      anim = null;
    }
    clearSparks();
    dice.classList.remove('live');
    dice.style.opacity = '';
    dice.style.transform = 'translate3d(-800px,-800px,0)';
    faces.forEach(function(f){
      f.classList.add('no');
      f.style.transform = '';
      f.style.opacity = '';
      f.style.visibility = '';
      f.style.backfaceVisibility = '';
    });
    bowl.style.opacity = '0';
    bowl.style.transform = '';
    hideFood();
    shadow.style.opacity = '0';
  }

  function showCard(item, isVeg){
    idea.textContent = item[0] + '  ' + item[1];
    note.style.display = 'none';
    kindTag.textContent = isVeg ? '🥦 Veg' : '🍖 Klasika';
    card.classList.remove('hidden');
    card.style.opacity = '';
  }

  function miniOrigin(mini){
    measure();
    var cubelet = mini.querySelector('.cubelet');
    var cr = cubelet.getBoundingClientRect();
    var ar = arena.getBoundingClientRect();
    var cx = cr.left + cr.width/2 - ar.left;
    var cy = cr.top + cr.height/2 - ar.top;
    var y = cy - (floorY - HALF);
    if (y > -36) y = -36;
    var x = Math.max(HALF + 8, Math.min(Math.max(HALF + 8, arenaW - HALF - 8), cx));
    var scale0 = Math.max(0.34, Math.min(0.8, cr.width / DICE));
    return {x:x, y:y, scale0:scale0};
  }

  function fastClear(){
    if (robotAnim){
      cancelAnimationFrame(robotAnim.raf);
      robotAnim = null;
    }
    robot.classList.remove('on', 'flip');
    robot.style.transform = 'translate3d(-400px,0,0)';
    dice.style.opacity = '';
    card.style.opacity = '';
    card.classList.add('hidden');
    hideFood();
    if (activeMini){
      activeMini.classList.remove('away');
      activeMini = null;
    }
    resetCube();
    state = 'idle';
    busy = false;
  }

  function roll(){
    if (busy) return;
    if (state === 'robot' || state === 'motion') return;
    if (state === 'reveal') fastClear();
    if (state !== 'idle') return;
    var arr = currentArr();
    var item = pickAvoidLast(arr);
    log.push(item[1]);
    if (log.length>10) log = log.slice(-10);
    LOGSAVE(log);

    busy = true;
    state = 'motion';
    card.classList.add('hidden');
    card.style.opacity = '';
    hint.textContent = 'Padá…';
    var mini = document.querySelector('.mini[data-mode="'+MODE+'"]');
    var origin = mini ? miniOrigin(mini) : {x: arenaW*0.5, y: -Math.max(160, arenaH*0.55), scale0: 0.5};
    activeMini = mini;
    var token = ++rollToken;
    resetCube();
    var shown = [];
    for (var i=0;i<6;i++) shown.push(pick(arr)[0]);
    faces.forEach(function(f, idx){
      setFaceEmoji(idx, shown[idx]);
      f.classList.remove('no');
    });
    dice.dataset.kind = MODE === 'veg' ? 'veg' : 'klasika';
    dice.classList.add('live');
    if (mini) mini.classList.add('away');
    if (token !== rollToken) return;
    launch(token, item, arr===VEG, origin, origin.scale0 || 0.5);
  }

  function applyToggle(){
    var btns = document.querySelectorAll('#shelf .mini');
    btns.forEach(function(b){
      b.classList.toggle('on', b.dataset.mode === MODE);
    });
  }

  function setMode(m){
    MODE = (m==='veg') ? 'veg' : 'klasika';
    try{ localStorage.setItem('kocka_mode', MODE); }catch(e){}
    applyToggle();
  }

  function showSoon(btn){
    btn.classList.remove('shake');
    void btn.offsetWidth;
    btn.classList.add('shake');
    var r = btn.getBoundingClientRect();
    soon.hidden = false;
    soon.style.left = (r.left + r.width/2) + 'px';
    soon.style.top = (r.top - 4) + 'px';
    hint.textContent = 'Táto kocka príde čoskoro';
    clearTimeout(soonT);
    soonT = setTimeout(function(){
      soon.hidden = true;
      if (state === 'idle') hint.textContent = 'Ťukni na kocku na polici';
    }, 1400);
  }

  function handleMini(b){
    if (!b) return;
    if (b.classList.contains('locked')){
      showSoon(b);
      return;
    }
    if (busy || state === 'motion' || state === 'robot') return;
    if (state === 'reveal'){
      hint.textContent = 'Najprv ťukni na jedlo';
      return;
    }
    setMode(b.dataset.mode);
    roll();
  }

  var shelf = document.getElementById('shelf');
  shelf.addEventListener('pointerup', function(e){
    var b = e.target.closest('.mini');
    if (!b) return;
    ptrStamp = Date.now();
    handleMini(b);
  });
  shelf.addEventListener('click', function(e){
    if (Date.now() - ptrStamp < 800) return;
    handleMini(e.target.closest('.mini'));
  });

  function onFoodTap(e){
    if (e){ e.preventDefault(); e.stopPropagation(); }
    if (state !== 'reveal' || busy) return;
    summonRobot();
  }
  food.addEventListener('pointerup', function(e){
    ptrStamp = Date.now();
    onFoodTap(e);
  });
  food.addEventListener('click', function(e){
    if (Date.now() - ptrStamp < 800) return;
    onFoodTap(e);
  });
  food.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); onFoodTap(e); }
  });
  card.addEventListener('pointerup', onFoodTap);
  dice.addEventListener('pointerup', function(e){
    if (state !== 'reveal') return;
    onFoodTap(e);
  });

  function placeRobot(x, armDeg){
    var h = robot.offsetHeight || 108;
    var bob = Math.sin((robotAnim ? robotAnim.t : 0) * 16) * 2.1;
    robot.style.transform = 'translate3d('+x.toFixed(1)+'px,'+(floorY - h + 10 + bob).toFixed(1)+'px,0)';
    armEl.style.transform = 'rotate('+armDeg.toFixed(2)+'deg)';
  }

  function spinWheels(x){
    var R = robotAnim;
    var prev = R.prevX == null ? x : R.prevX;
    R.spin = (R.spin || 0) + (x - prev) * 2.5;
    R.prevX = x;
    wheels.style.setProperty('--spin', R.spin.toFixed(1)+'deg');
  }

  function spatulaCenter(){
    var sp = document.getElementById('spatula').getBoundingClientRect();
    var ar = arena.getBoundingClientRect();
    return {
      x: sp.left + sp.width*0.62 - ar.left,
      y: sp.top + sp.height*0.58 - ar.top
    };
  }

  function summonRobot(){
    if (state !== 'reveal' || busy || !anim) return;
    busy = true;
    state = 'robot';
    anim.handed = true;
    hint.textContent = 'Robot berie jedlo…';
    measure();
    var rw = robot.offsetWidth || 86;
    var fromLeft = anim.x > arenaW * 0.38;
    var home = foodRestPos();
    robot.classList.add('on');
    robot.classList.toggle('flip', !fromLeft);
    var startX = fromLeft ? -rw - 28 : arenaW + 18;
    var approachX = fromLeft ? (anim.x - rw + 22) : (anim.x - 8);
    var endX = fromLeft ? arenaW + 30 : -rw - 36;
    robotAnim = {
      t:0, last:0, fromLeft:fromLeft, startX:startX, approachX:approachX, endX:endX,
      home:home, x:startX, prevX:startX, spin:0, holdX:null, raf:0
    };
    placeRobot(startX, 0);
    robotAnim.raf = requestAnimationFrame(robotLoop);
  }

  function finishRobot(){
    if (robotAnim){
      cancelAnimationFrame(robotAnim.raf);
      robotAnim = null;
    }
    robot.classList.remove('on', 'flip');
    robot.style.transform = 'translate3d(-400px,0,0)';
    armEl.style.transform = '';
    dice.style.opacity = '';
    card.style.opacity = '';
    card.classList.add('hidden');
    hideFood();
    if (activeMini){
      activeMini.classList.remove('away');
      activeMini.classList.add('pop');
      var m = activeMini;
      setTimeout(function(){ m.classList.remove('pop'); }, 520);
      activeMini = null;
    }
    resetCube();
    state = 'idle';
    busy = false;
    hint.textContent = 'Vyber si ďalšiu kocku na polici';
  }

  function robotLoop(now){
    var R = robotAnim;
    if (!R) return;
    try{
      var dt = R.last ? Math.min(0.034, (now - R.last)/1000) : 0.016;
      if (dt < 0.001) dt = 0.001;
      R.last = now;
      R.t += dt;
      measure();
      var t = R.t;
      var x = R.x;
      var arm = 0;
      var placed = false;
      if (t < 0.82){
        var u = smooth(t / 0.82);
        x = R.startX + (R.approachX - R.startX) * u;
        arm = Math.sin(t * 14) * 12;
        placeFood(R.home.x, R.home.y, 1, 0, 1);
      } else if (t < 1.2){
        arm = -18 + smooth((t - 0.82) / 0.38) * 70;
        placeRobot(x, arm);
        placed = true;
        var sp = spatulaCenter();
        var err = R.home.x - sp.x;
        x += Math.max(-26, Math.min(26, err * 0.6));
        placeFood(R.home.x, R.home.y, 1, 0, 1);
      } else if (t < 1.7){
        if (R.holdX == null) R.holdX = x;
        x = R.holdX;
        var u3 = smooth((t - 1.2) / 0.5);
        arm = 52 - u3 * 60;
        placeRobot(x, arm);
        placed = true;
        var sp2 = spatulaCenter();
        var arc = Math.sin(u3 * Math.PI) * 32;
        placeFood(
          R.home.x + (sp2.x - R.home.x) * u3,
          R.home.y + (sp2.y - R.home.y) * u3 - arc,
          1 - 0.05*u3,
          u3 * 8,
          1
        );
      } else if (t < 2.65){
        if (R.holdX == null) R.holdX = x;
        var u4 = smooth((t - 1.7) / 0.95);
        x = R.holdX + (R.endX - R.holdX) * u4;
        arm = 2 + Math.sin(t * 14) * 6;
        placeRobot(x, arm);
        placed = true;
        var sp3 = spatulaCenter();
        placeFood(sp3.x, sp3.y, 0.92, 6, 1);
        var fade = Math.min(1, Math.max(0, (t - 1.82) / 0.42));
        dice.style.opacity = String(1 - fade);
        card.style.opacity = String(1 - Math.min(1, (t - 1.7) / 0.35));
      } else {
        finishRobot();
        return;
      }
      if (!placed) placeRobot(x, arm);
      R.x = x;
      spinWheels(x);
      R.raf = requestAnimationFrame(robotLoop);
    } catch (err){
      console.error(err);
      finishRobot();
    }
  }

  window.addEventListener('resize', function(){
    measure();
    if (!anim) return;
    var pad = HALF + 12;
    anim.x = Math.max(pad, Math.min(Math.max(pad, arenaW - pad), anim.x));
    if (anim.phase === 'hold' && state === 'reveal'){
      anim.y = 0;
      anim.q = [1,0,0,0];
      applyDice();
      setOpenPose(-118, 78, 1);
      var h = foodRestPos();
      placeFood(h.x, h.y, 1, 0, 1);
      setShadow(0, 0, 1);
    }
  });

  window.GAME = {
    get: function(){ return { mode: MODE,
      last: log.length?log[log.length-1]:null,
      vis: card.classList.contains('hidden')?'hidden':'shown',
      busy: busy,
      foodShown: food.classList.contains('shown'),
      face1: (dice.querySelector('.f1 .em')||{}).textContent }; },
    set: function(m){ setMode(m); },
    roll: function(){ roll(); },
    count: function(){ return (MODE==='veg'?VEG:KLASIKA).length; }
  };

  function paintIdleFaces(){
    var arr = currentArr();
    faces.forEach(function(f, idx){
      setFaceEmoji(idx, arr[idx % arr.length][0]);
    });
  }

  applyToggle();
  paintIdleFaces();
  measure();
  lightFaces([1,0,0,0]);

  var deferredPrompt = null;
  var installBtn = document.getElementById('installBtn');
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredPrompt = e;
    if(installBtn) installBtn.hidden = false;
  });
  if(installBtn){
    installBtn.addEventListener('click', function(){
      installBtn.hidden = true;
      if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt = null; }
    });
  }
  if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1')){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
})();
</script>
</body>

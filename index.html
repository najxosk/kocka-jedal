<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#2b1a12">
<title>Kocka jedál 🎲</title>
<style>
  :root{
    --bg1:#2b1a12; --bg2:#4a2413; --accent:#ffb45e; --accent2:#ff7e5f;
    --card:#fff7ec; --card-txt:#3a2418; --dim:#d9b48a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:radial-gradient(circle at 50% 20%, var(--bg2), var(--bg1) 70%);
    color:#fff; overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:16px; touch-action:none;
  }
  h1{font-size:26px; margin:0 0 6px; font-weight:800; letter-spacing:.5px;
    display:flex; align-items:center; gap:8px;}
  .sub{color:var(--dim); font-size:15px; margin-bottom:12px; text-align:center;}
  .sub b{color:var(--accent);}

  /* Toggle */
  .toggle{display:flex; background:rgba(255,255,255,.08); border-radius:999px; padding:4px;
    gap:4px; margin-bottom:18px; border:1px solid rgba(255,255,255,.15);}
  .toggle button{border:0; background:transparent; color:var(--dim); font-weight:700;
    padding:8px 16px; border-radius:999px; font-size:14px; cursor:pointer;}
  .toggle button.on{background:linear-gradient(135deg,var(--accent2),var(--accent)); color:#3a2418;}

  /* Dice stage */
  .stage{width:190px; height:190px; perspective:720px; margin:4px 0 6px; position:relative;}
  .dice{
    width:150px; height:150px; position:absolute; top:20px; left:20px;
    transform-style:preserve-3d; cursor:pointer;
    transition:transform 1.15s cubic-bezier(.17,.6,.2,1);
    will-change:transform; transform:rotateX(0deg) rotateY(0deg);
  }
  .face{
    position:absolute; width:150px; height:150px; border-radius:20px;
    background:linear-gradient(145deg,#ffffff, #ffdca0);
    display:flex; align-items:center; justify-content:center;
    font-size:54px; box-shadow:inset -8px -10px 22px rgba(120,70,10,.28);
    border:2px solid rgba(180,120,40,.35);
    transition:transform .6s cubic-bezier(.3,.6,.4,1), opacity .45s ease .1s;
    pointer-events:none;
  }
  .face .glow{position:absolute; inset:0; border-radius:20px;
    background:radial-gradient(circle at 32% 26%, rgba(255,255,255,.95), rgba(255,255,255,0) 45%);}
  .face .em{position:relative;}
  .f1{transform:rotateY(0deg)    translateZ(75px);}
  .f2{transform:rotateY(90deg)   translateZ(75px);}
  .f3{transform:rotateY(180deg)  translateZ(75px);}
  .f4{transform:rotateY(-90deg)  translateZ(75px);}
  .f5{transform:rotateX(90deg)   translateZ(75px);}
  .f6{transform:rotateX(-90deg)  translateZ(75px);}

  /* rozpad kocky - kazda tvar vyleti inym smerom */
  .face.no{opacity:0; visibility:hidden;}
  .show.f1{transform:translate(-150px,-90px) rotate(-32deg) rotateX(45deg); opacity:0;}
  .show.f2{transform:translate(150px,-70px) rotate(26deg); opacity:0;}
  .show.f3{transform:translate(-20px,-185px) rotate(8deg) scale(.8); opacity:0;}
  .show.f4{transform:translate(-170px,50px) rotate(-14deg); opacity:0;}
  .show.f5{transform:translate(90px,175px) rotate(36deg); opacity:0;}
  .show.f6{transform:translate(-80px,180px) rotate(-34deg); opacity:0;}

  /* jedlo - spadne zo stredu kocky */
  .food{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:100px; line-height:1; filter:drop-shadow(0 14px 18px rgba(0,0,0,.5));
    opacity:0; transform:scale(.2) translateY(10px);
    transition:transform .55s cubic-bezier(.2,.85,.35,1.3), opacity .25s ease;
    pointer-events:none;
  }
  .food.shown{opacity:1; transform:scale(1) translateY(0);}

  /* Result card */
  .card{width:100%; max-width:340px; min-height:118px;
    background:var(--card); color:var(--card-txt); border-radius:22px;
    padding:14px 22px; text-align:center;
    box-shadow:0 18px 40px rgba(0,0,0,.45);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative; overflow:hidden; margin-top:10px;}
  .card .idea{font-size:23px; font-weight:800; margin:0; line-height:1.2;}
  .card .note{font-size:13px; color:#8a6a48; margin-top:4px;}
  .card .kind-tag{position:absolute; top:10px; right:12px; font-size:12px; font-weight:700;
    background:var(--accent); color:#3a2418; padding:3px 10px; border-radius:999px;}
  .card.hidden{display:none;}
  .hint{color:var(--dim); font-size:14px; margin-top:12px; min-height:20px; text-align:center;}
  .arlink{display:inline-block; margin:14px auto 0; text-decoration:none; font-weight:700;
    color:var(--accent); background:rgba(255,255,255,.10); border:1px solid rgba(255,182,94,.45);
    padding:9px 18px; border-radius:999px; font-size:14px; cursor:pointer;
    transition:background .2s; line-height:1.1;}
</style>
</head>
<body>

  <h1>Kocka jedál 🎲</h1>
  <div class="sub">Nevieš čo jesť? <b>Hod kockou!</b></div>
  <a class="arlink" href="robot-ar.html">🎲 AR Kocka Robot (experiment) →</a>

  <div class="toggle" id="toggle">
    <button data-mode="klasika" class="on">🍖 Klasická</button>
    <button data-mode="veg">🥦 Vegetariánska</button>
  </div>

  <div class="stage" id="stage">
    <div class="dice" id="dice">
      <div class="face f1"><span class="glow"></span><b class="em">🍕</b></div>
      <div class="face f2"><span class="glow"></span><b class="em">🍜</b></div>
      <div class="face f3"><span class="glow"></span><b class="em">🍝</b></div>
      <div class="face f4"><span class="glow"></span><b class="em">🌮</b></div>
      <div class="face f5"><span class="glow"></span><b class="em">🥘</b></div>
      <div class="face f6"><span class="glow"></span><b class="em">🍣</b></div>
    </div>
    <div class="food" id="food">🍕</div>
  </div>

  <div class="card hidden" id="card">
    <p class="idea" id="idea"></p>
    <div class="note" id="note"></div>
    <div class="kind-tag" id="kindTag"></div>
  </div>
  <div class="hint" id="hint">Dotkni sa kocky 🎲</div>

<script>
(function(){
  var MODE = localStorage.getItem('kocka_mode') || 'klasika';

  function LOG(){
    try{ return JSON.parse(localStorage.getItem('kocka_log') || '[]'); }
    catch(e){ return []; }
  }
  function LOGSAVE(a){
    try{ localStorage.setItem('kocka_log', JSON.stringify(a)); }catch(e){}
  }

  var KLASIKA = [
    ['🥟','Bryndzové halušky'],
    ['🍲','Kapustnica'],
    ['🍖','Vyprážaný rezeň s kašou'],
    ['🥩','Sviečková na smotane'],
    ['🥟','Pirohy s bryndzou'],
    ['🥔','Zemiakové placky'],
    ['🍖','Šunkofleky'],
    ['🥘','Guláš s knedľou'],
    ['🐟','Vyprážaný kapor'],
    ['🍗','Kurací paprikáš'],
    ['🍕','Margherita pizza'],
    ['🍝','Špagety carbonara'],
    ['🌮','Tacos'],
    ['🍔','Burger a hranolky'],
    ['🥘','Španielska paella'],
    ['🍜','Ramen'],
    ['🍛','Kuracie kari s ryžou'],
    ['🌯','Burrito'],
    ['🍣','Sushi set'],
    ['🍚','Vyprážaná ryža'],
    ['🍢','Kebab wrap'],
    ['🥩','Steak s hranolkami'],
    ['🌶️','Chilli con carne'],
    ['🍗','Kuracie teriyaki'],
    ['🥗','Cézar šalát'],
    ['🍝','Lasagne'],
    ['🍲','Tom Yum'],
    ['🍤','Vyprážané krevety'],
    ['🥪','Grilled cheese'],
    ['🍳','Shakshuka'],
  ];

  var VEG = [
    ['🥟','Halušky s hubami'],
    ['🥔','Zemiakové placky'],
    ['🍲','Zeleninová polievka'],
    ['🍲','Šošovicový prívarok'],
    ['🍞','Cesnakovka s chlebom'],
    ['🍛','Šošovicové kari'],
    ['🥙','Falafel'],
    ['🥑','Avokádový toast'],
    ['🍝','Penne s pestom'],
    ['🍜','Ramen s tofu'],
    ['🌯','Burrito s fazuľou'],
    ['🥗','Buddha bowl'],
    ['🥘','Cícerové kari'],
    ['🍚','Ryža s tofu'],
    ['🌮','Zeleninové tacos'],
    ['🍲','Šampiňónová polievka'],
    ['🍔','Zeleninový burger'],
    ['🥟','Tofu gyoza'],
    ['🍝','Aglio e olio'],
    ['🥗','Quinoa šalát'],
    ['🍛','Dhal'],
    ['🌽','Kukuricová polievka'],
    ['🍕','Zeleninová focaccia'],
    ['🍆','Vegánska parmigiana'],
    ['🍲','Miso polievka'],
    ['🥗','Coleslaw wrap'],
    ['🍱','Zeleninový bibimbap'],
    ['🥦','Brokolica na čínsky spôsob'],
    ['🍠','Bataty s dipom'],
    ['🥙','Hummus s pita'],
  ];

  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  var dice = document.getElementById('dice');
  var stage = document.getElementById('stage');
  var food = document.getElementById('food');
  var card = document.getElementById('card');
  var idea = document.getElementById('idea');
  var note = document.getElementById('note');
  var kindTag = document.getElementById('kindTag');
  var hint = document.getElementById('hint');
  var faces = Array.prototype.slice.call(dice.querySelectorAll('.face'));
  var log = LOG();
  var busy = false;

  function currentArr(){ return MODE==='veg'?VEG:KLASIKA; }

  function pickAvoidLast(arr){
    var last = log.length ? log[log.length-1] : null;
    var candidates = arr.filter(function(x){ return x[1] !== last; });
    if(!candidates.length) candidates = arr;
    return pick(candidates);
  }

  function setFaceEmoji(idx, emoji){
    var b = faces[idx].querySelector('.em');
    if(b) b.textContent = emoji;
  }

  // vrat kocku do kocky + schovaj jedlo
  function resetCube(){
    dice.style.transform = 'rotateX(0deg) rotateY(0deg)';
    faces.forEach(function(f){ f.classList.remove('show'); f.classList.add('no'); });
    food.classList.remove('shown');
  }

  function roll(){
    if(busy) return;
    var arr = currentArr();
    var item = pickAvoidLast(arr);
    log.push(item[1]);
    if(log.length>10) log=log.slice(-10);
    LOGSAVE(log);

    busy = true;
    card.classList.add('hidden');
    hint.textContent = 'Točí sa…';

    // 1) schovaj jedlo, priprav kocku
    resetCube();
    setTimeout(function(){
      var shown=[];
      for(var i=0;i<6;i++) shown.push(pick(arr)[0]);
      faces.forEach(function(f,idx){ setFaceEmoji(idx,shown[idx]); });
      // zloz kocku (odobrat skryte) a roztoc
      faces.forEach(function(f){ f.classList.remove('no'); });
      void dice.offsetWidth;
      var sx = (Math.floor(Math.random()*3)+3)*360;
      var sy = (Math.floor(Math.random()*3)+2)*360;
      var tilt = (Math.random()*2-1)*14;
      dice.style.transform = 'rotateX('+sx.toFixed(1)+'deg) rotateY('+sy.toFixed(1)+'deg) rotateZ('+tilt.toFixed(1)+'deg)';
    }, 250);

    setTimeout(function(){
      // 3) rozpad + vyberie jedlo: tvar f5 predstavuje "hornu" tvar kocky
      food.textContent = item[0];
      faces.forEach(function(f){ f.classList.add('show'); });
      void food.offsetWidth;
      food.classList.add('shown');
      showCard(item, arr===VEG);
      hint.textContent = 'Hop! Dotkni sa pre ďalší hod';
      busy = false; /* kocka je pripravena na dalsi hod hned, ako vyskovci jedlo */
    }, 1500);
  }

  function showCard(item, isVeg){
    idea.textContent = item[1];
    note.style.display = 'none';
    kindTag.textContent = isVeg ? '🥦 Veg' : '🍖 Klasika';
    card.classList.remove('hidden');
  }

  function applyToggle(){
    var btns = document.querySelectorAll('#toggle button');
    btns.forEach(function(b){
      b.classList.toggle('on', b.dataset.mode === MODE);
    });
  }

  var t = document.getElementById('toggle');
  t.addEventListener('pointerup', function(e){
    var b = e.target.closest('button');
    if(!b) return;
    MODE = b.dataset.mode;
    applyToggle();
    card.classList.add('hidden');
    hint.textContent = 'Dotkni sa kocky 🎲';
    resetCube();
    var arr=currentArr();
    faces.forEach(function(f,idx){
      setTimeout(function(){ f.classList.remove('no'); }, idx*40);
      setFaceEmoji(idx, arr[idx%arr.length][0]);
    });
  });
  t.addEventListener('pointerdown', function(e){ e.preventDefault(); });
  t.addEventListener('touchstart', function(e){ e.preventDefault(); }, {passive:false});

  stage.addEventListener('pointerup', function(e){
    roll();
  });
  stage.addEventListener('pointerdown', function(e){ e.preventDefault(); });
  stage.addEventListener('touchstart', function(e){ e.preventDefault(); }, {passive:false});

  window.GAME = {
    get: function(){ return { mode: MODE,
      last: log.length?log[log.length-1]:null,
      vis: card.classList.contains('hidden')?'hidden':'shown',
      busy: busy,
      foodShown: food.classList.contains('shown'),
      face1: (dice.querySelector('.f1 .em')||{}).textContent }; },
    set: function(m){ MODE = (m==='veg')?'veg':'klasika'; applyToggle(); },
    roll: function(){ roll(); },
    count: function(){ return (MODE==='veg'?VEG:KLASIKA).length; }
  };

  applyToggle();
})();
</script>
</body>
</html>
